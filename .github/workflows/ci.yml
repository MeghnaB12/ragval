name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,dashboard]"
      - name: Lint
        run: ruff check src tests dashboard/backend
      - name: Format check
        run: ruff format --check src tests dashboard/backend
      - name: Type check (lowest supported Python)
        if: matrix.python-version == '3.10'
        run: mypy src/ragval
      - name: Test
        run: pytest --cov=ragval --cov-report=term-missing --cov-fail-under=60
      - name: Build package
        if: matrix.python-version == '3.12'
        run: |
          python -m build
          python -m pip install --no-deps --force-reinstall dist/*.whl
          ragval --help

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/frontend
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose
        run: docker compose config
      - name: Build dashboard images
        run: docker compose build

services:
  api:
    build:
      context: .
      dockerfile: dashboard/backend/Dockerfile
    environment:
      RAGVAL_CORS_ORIGINS: http://localhost:8080
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: dashboard/frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
